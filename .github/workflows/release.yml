# 仅在发布 Release 时触发编译（多架构 + Alpine 静态版）
# 产物自动附加到对应的 Release 上
name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 通用 Linux（glibc 动态链接）
          - target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - target: armv7-unknown-linux-gnueabihf
            label: linux-armv7
          # Alpine（musl 静态链接，任意 Linux 亦可直接运行）
          - target: x86_64-unknown-linux-musl
            label: alpine-x86_64
          - target: aarch64-unknown-linux-musl
            label: alpine-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          ARTIFACT="rfs-${VERSION}-${{ matrix.label }}"
          mkdir -p "dist/${ARTIFACT}"
          cp "target/${{ matrix.target }}/release/rfs" "dist/${ARTIFACT}/"
          cp README.md CONFIG.md "dist/${ARTIFACT}/" 2>/dev/null || true
          cd dist
          tar -czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          echo "---- artifact ----"
          ls -lh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
