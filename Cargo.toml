[package]
name = "rfs"
version = "0.4.0"
edition = "2021"
description = "rfs - 轻量级、可平替 nginx 的 Rust 静态文件服务器（HTTP/1.1+HTTP/2+HTTP/3，鉴权、虚拟主机、热重载）"
license = "MIT"

[[bin]]
name = "rfs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "time", "sync"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "client", "client-legacy"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12", "logging"] }
regex = "1"
http-body-util = "0.1"
http-body = "1"
http = "1"
bytes = "1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
quinn = "0.11"
h3 = { version = "0.0.8", features = ["tracing"] }
h3-quinn = "0.0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
percent-encoding = "2"
subtle = "2"
arc-swap = "1"
base64 = "0.22"
httpdate = "1"
anyhow = "1"
memmap2 = "0.9"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 1